:root{--bg:#F2F6F9;--surface:#FFFFFF;--ink:#0F2233;--muted:#51657A;--line:#CBD8E3;--accent:#0E7C86;--warm:#D99A00;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1722;--surface:#12212F;--ink:#E6EEF5;--muted:#9DB1C4;--line:#244056;--accent:#4FC3CC;--warm:#F0B429;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1722;--surface:#12212F;--ink:#E6EEF5;--muted:#9DB1C4;--line:#244056;--accent:#4FC3CC;--warm:#F0B429;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;font-size:16px}
a{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;padding-top:16px;padding-bottom:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:1.25rem;text-decoration:none;color:var(--ink)}
nav a{margin-left:20px;text-decoration:none;color:var(--muted);padding:4px 0;border-bottom:2px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--warm)}
nav a:focus-visible,.brand:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);line-height:1.4;margin:0}
.hero{position:relative;isolation:isolate;display:flex;align-items:center;min-height:340px;margin:36px 0 0;padding:clamp(28px,5vw,58px);overflow:hidden;border:1px solid rgba(145,184,199,.22);border-radius:26px;background:#091a27;box-shadow:0 14px 38px rgba(15,34,51,.12)}
.hero-background{position:absolute;z-index:-2;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% center}
.hero::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,rgba(5,17,27,.97) 0%,rgba(5,19,29,.9) 42%,rgba(5,20,30,.56) 72%,rgba(5,20,30,.24) 100%)}
.hero-copy{max-width:39em}
.hero h1{font-size:clamp(2.1rem,6vw,3.35rem);font-weight:700;color:#F4F8FA;letter-spacing:.035em;text-shadow:0 2px 20px rgba(0,0,0,.24)}
.hero .en{color:#D1E0E7;margin:12px 0 0;max-width:39em;font-size:.96rem;line-height:1.9}
.hero .en a{color:#A9E7E1;text-decoration:underline;text-decoration-color:rgba(169,231,225,.54);text-decoration-thickness:1px;text-underline-offset:3px}
.hero .en a:hover{color:#fff;text-decoration-color:var(--warm)}
@media(max-width:600px){.hero{min-height:320px;margin-top:24px;padding:28px 24px;border-radius:20px}.hero-background{object-position:67% center}.hero::after{background:linear-gradient(90deg,rgba(5,17,27,.96),rgba(5,19,29,.82) 70%,rgba(5,20,30,.58))}.hero .en{font-size:.9rem}}
.member-group-title{font-size:1.05rem;margin:24px 0 10px;padding-left:10px;border-left:2px solid var(--accent)}
#members section>.member-group-title:first-of-type{margin-top:0}
.members{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
section{padding:40px 0 8px}
section>h2{font-size:1.5rem;margin-bottom:16px;padding-left:12px;border-left:4px solid var(--warm)}
.covers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
figure{margin:0}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--surface)}
figcaption{font-size:.875rem;color:var(--muted);margin-top:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px 28px;margin:0}
.fields dt{font-family:var(--serif);font-weight:700;font-size:1.1rem}
.fields dd{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.pi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);padding:20px 24px}
.pi .role{color:var(--muted);font-size:.875rem;margin:0}
.pi .nm{font-family:var(--serif);font-size:1.5rem;font-weight:700;margin:2px 0}
.pi .contact{margin:4px 0 0;font-size:.9rem}
.pi .role + .contact{margin-top:12px}
.members{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.members li{background:var(--surface);border:1px solid var(--line);padding:14px 16px;font-family:var(--serif);font-size:1.15rem}
.members small{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted)}
.pubs h3{font-size:1.2rem;margin:28px 0 8px;color:var(--accent)}
.pubs ol{margin:0;padding-left:1.4em}
.pubs li{margin-bottom:12px}
.research{max-width:40em;font-size:1.05rem;margin:0}
footer{margin-top:56px;border-top:1px solid var(--line);padding:20px 0 28px;color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}

</style>

const $ = id => document.getElementById(id);
function el(tag, props, kids){ const e=document.createElement(tag); Object.assign(e,props||{}); (kids||[]).forEach(k=>e.append(k)); return e; }
function piCard(){
  const p = LAB.pi;
  const out = [
    el("p",{className:"nm",textContent:p.name+" "+p.title}),
    el("p",{className:"role",textContent:p.nameEn})
  ];
  if (p.office) out.push(el("p", {className:"contact", textContent:"居室: " + p.office}));
  if (p.tel) out.push(el("p", {className:"contact", textContent:"電話: " + p.tel}));
  if (p.email) {
    const address = p.email.replace(/\s*\[at\]\s*/i, "@");
    out.push(el("p", {className:"contact"}, [
      "E-mail: ",
      el("a", {href:"mailto:" + address, textContent:address})
    ]));
  }

$("brand").textContent = LAB.nameJa;
$("h-name").textContent = LAB.nameJa;
$("h-en").append(
  document.createTextNode(LAB.nameEn + " | "),
  el("a",{href:LAB.departmentUrl,textContent:LAB.affiliationEnDepartment,target:"_blank",rel:"noopener"}),
  document.createTextNode(", "),
  el("a",{href:LAB.collegeUrl,textContent:LAB.affiliationEnCollege,target:"_blank",rel:"noopener"})
);
$("research").append(document.createTextNode(LAB.research+" 詳細は"), el("a",{href:"#publications",textContent:"研究業績"}), document.createTextNode("のページをご覧ください。"));

piCard().forEach(n=>$("pi-mem").append(n));

LAB.covers.forEach(c=>$("covers").append(el("figure",{},[el("img",{src:c.img,alt:c.caption,loading:"lazy"}),el("figcaption",{textContent:c.caption})])));
LAB.members.forEach(m=>{ const li=el("li",{textContent:m.name}); if(m.role) li.append(el("small",{textContent:m.role})); $("mlist").append(li); });

(function(){
  const box=$("pubs");
  box.append(el("p",{},[el("a",{href:LAB.scholar,textContent:"Google Scholar",target:"_blank",rel:"noopener"})]));
  LAB.publications.forEach(s=>{
    box.append(el("h3",{textContent:s.title}));
    const ol=el("ol");
    s.items.forEach(p=>{
      const li=el("li",{textContent:p.text+" "}), href=p.doi?"https://doi.org/"+p.doi:p.url;
      if(href) li.append(el("a",{href:href,textContent:p.doi?"DOI":"Link",target:"_blank",rel:"noopener"}));
      ol.append(li);
    });
    box.append(ol);
  });
})();

$("foot").textContent = LAB.nameJa + " | " + LAB.affiliation + " | © " + new Date().getFullYear();

const pages=["home","publications","members"];
function route(){
  const h=(location.hash||"#home").slice(1), p=pages.includes(h)?h:"home";
  pages.forEach(x=>{ $(x).hidden = x!==p; });
  document.querySelectorAll("nav a").forEach(a=>{ if(a.dataset.p===p) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}
addEventListener("hashchange",route); route();
</script>
